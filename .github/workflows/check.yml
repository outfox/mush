name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Windows only: the host and its real-host probe are developed there. Gradle provisions its own JDK 25 toolchain.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: ./gradlew.bat check --console=plain
